[package]
name = "launchpad-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad_core"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "reward-vault/idl-build", "merkle-distributor/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
reward-vault = { path = "../reward-vault", features = ["cpi"] }
merkle-distributor = { path = "../merkle-distributor", features = ["cpi"] }
